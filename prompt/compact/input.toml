# The lines that frame a compaction's input for prompt/compact/system.md.
dropping = "The messages dropping out of your replay, in order:"
loop = "[the loop] $text"
thinking = "(thinking) $text"
said = "(you said) $text"
call = "(you called $tool) $args"
result = "(result) $text"
previous = "Your previous summary. The new one replaces it: carry over what it says, more briefly the older it is.\n$summary"
record = "What actually ran in these messages (the record, from the tool results; your thinking and replies may claim more):"
span = "These messages run from wake $first ($first_time UTC) to wake $last ($last_time UTC), $hours hours $minutes minutes."
covers = "Your new summary covers from wake $since ($since_time UTC), where the previous one starts, to wake $last ($last_time UTC): $hours hours $minutes minutes in all."
ran = "- $call: $times"
once = "once"
times = "$n times"
result_seen = "  $label: $result"
nothing_ran = "No tool ran in these messages."
nothing_else = "Nothing else was run, read or checked, whatever your thinking or replies say."
too_long = "That was $words words. Write it again in about 500 words, inside <summary></summary>."
